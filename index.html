<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cookie Monster Sports</title>

    <meta name="description" content="Catálogo deportivo de Cookie Monster Sports">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- =========================
         ENCABEZADO
    ========================== -->

    <header class="encabezado">

        <div class="contenedor">

            <img
                src="img/logo.png"
                alt="Cookie Monster Sports"
                class="logo"
            >

            <h1>Cookie Monster Sports</h1>

            <input
                type="search"
                id="busqueda"
                placeholder="Buscar producto..."
                autocomplete="off"
            >

        </div>

    </header>


    <!-- =========================
         CONTENIDO
    ========================== -->

    <main class="contenedor">

        <section id="catalogo" class="catalogo">

            <!--
                Las tarjetas serán creadas
                automáticamente por app.js
            -->

        </section>

    </main>


    <!-- =========================
         PIE DE PÁGINA
    ========================== -->

    <footer class="footer">

        <p>
            © 2026 Cookie Monster Sports
        </p>

    </footer>

<script src="js/render.js"></script>
<script src="js/app.js"></script>

</body>
</html>
