<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Catálogo CookieMonster Sports</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    margin:40px;
}

h1{
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
}

.card{

    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.15);

}

.card img{

width:100%;

}

.card h3{

padding:15px;

text-align:center;

}

</style>

</head>

<body>

<h1>CookieMonster Sports</h1>

<div class="grid">

<div class="card">

<img src="https://picsum.photos/400/500">

<h3>Real Madrid Home Player</h3>

</div>

<div class="card">

<img src="https://picsum.photos/401/500">

<h3>Barcelona Away Fan</h3>

</div>

<div class="card">

<img src="https://picsum.photos/402/500">

<h3>México Local Mujer</h3>

</div>

</div>

</body>

</html>
