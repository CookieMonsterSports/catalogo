<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CookieMonster Sports</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <header>

        <div class="logo">

            <img src="img/logo.png"
                 alt="Logo CookieMonster Sports">

        </div>

        <h1>CookieMonster Sports</h1>

        <p class="subtitulo">

            Premium Jerseys Catalog

        </p>

        <input
            id="buscar"
            type="search"
            placeholder="Buscar equipo o modelo...">

    </header>


    <main>

<section id="contenedor-productos">

    <!-- Tarjeta de ejemplo -->

    <article class="tarjeta-producto">

        <div class="imagen-producto">

            <img
                src="https://picsum.photos/800/1000"
                alt="Producto de ejemplo">

        </div>

        <div class="informacion-producto">

            <h2>Real Madrid</h2>

            <p>25/26 Home Player</p>

        </div>

    </article>

</section>

    </main>


    <footer>

        © CookieMonster Sports

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
